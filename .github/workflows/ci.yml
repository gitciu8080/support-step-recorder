name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable Rust
        run: rustup default stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (cargo pkgid -p support-step-recorder-gui) -replace '^.*[@#]', ''
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match Cargo version" }
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Build Windows executable
        run: cargo build --release --locked -p support-step-recorder-gui
      - name: Package Windows executable
        shell: pwsh
        run: |
          $version = (cargo pkgid -p support-step-recorder-gui) -replace '^.*[@#]', ''
          $archive = "ssr-v$version-windows-x86_64.zip"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/ssr.exe package/
          Copy-Item README.md package/
          Copy-Item crates/ssr-gui/assets/Droid-LICENSE.txt package/
          Copy-Item docs/release-v0.0.1.md package/RELEASE-NOTES.md
          Compress-Archive -Path package/* -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x86_64
          path: |
            ssr-*-windows-x86_64.zip
            ssr-*-windows-x86_64.zip.sha256

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-x86_64
          path: release-assets
      - name: Publish release with Windows binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME 中文增强版" --notes-file docs/release-v0.0.1.md
